{% extends 'base.html' %}

{% block style %}
<style>
    /* Center the form on the page */
#signup-container {
    max-width: 400px;
    margin: 50px auto;
    padding: 40px;
    background-color: #ffffff9e;
    border-radius: 32px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    backdrop-filter: blur(10px);
}

/* Style the form fields */
#signup-container input,
#signup-container select,
#signup-container button {
    width: 100%;
    height: 34px;
    padding: 6px 8px;
    margin: 1px -5px 2px;
    border-radius: 16px;
    border: 1px solid rgb(0, 115, 126);
    font-size: 16px;
    box-sizing: border-box;
}

/* Style the button */
#signup-container button {
    background-color: rgb(0, 115, 126);
    color: #fff;
    border: none;
    cursor: pointer;
    transition: 0.3s;
}

#signup-container button:hover {
    background-color: rgb(0, 90, 100);
}

/* Heading */
#signup-container h1 {
    text-align: center;
    margin: 0px 0px;
    color: rgb(0, 115, 126);
    margin-top: -28px;
}

/* Messages */
#signup-container p {
    color: rgb(0, 0, 0);
    text-align:left;
}

/* Responsive */
@media (max-width: 500px) {
    #signup-container {
        padding: 20px;
        margin: 20px;
    }
}

#signup-container li{
    display: none;
}
</style>
{% endblock %}

{% block content %}
    <div id="signup-container">
        <h1>Register</h1>
        <form action="" method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button>submit</button>
        </form>
    </div>
{% endblock %}
